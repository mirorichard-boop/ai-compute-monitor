name: Daily data update

on:
  schedule:
    # 14:00 UTC daily: after Ornn's ~12:00 UTC OTPI compute and the prior day's 20:00 UTC OCPI settle.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml certifi

      - name: Run collectors (fail soft)
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python collectors/run_all.py

      - name: Build page data
        run: python build/build.py

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data update $(date -u +%Y-%m-%d)"
            git push
          fi
